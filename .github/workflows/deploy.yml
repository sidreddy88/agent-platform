name: Deploy to ECS

# Replaces the manual deploy flow:
#   docker build -> ECR push -> aws ecs update-service --force-new-deployment
#
# Trigger:
#   - Push to main (auto-deploy)
#   - workflow_dispatch (manual rerun without needing a new commit)
#
# Auth: short-lived AWS creds via OIDC. The IAM role
# `agent-platform-prod-github-deploy` is provisioned in
# infra/agent_platform/github_oidc.tf and trusts this exact repo + branch.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      # targets/target-app/ no longer lives in this repo at all (moved to a
      # private repo + S3 fetch at container startup, see
      # docs/PLAN_TARGET_HARNESS_SPLIT.md) -- the AGENTS.md/CONSTRAINTS.md
      # **.md exception this used to need is gone with it. A harness content
      # change now ships via that repo's own sync-to-s3.yml, not this one.
      - "infra/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel a deploy mid-flight

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "542337758768"
  ECR_REPOSITORY: agent-platform-prod
  ECS_CLUSTER: agent-platform-prod
  ECS_SERVICE: agent-platform-prod
  ROLE_ARN: arn:aws:iam::542337758768:role/agent-platform-prod-github-deploy
  # Stable for the ALB's lifetime; the deploy role isn't granted
  # elasticloadbalancing:DescribeLoadBalancers so this can't be looked up
  # dynamically without widening its IAM policy.
  ALB_DNS: agent-platform-prod-alb-1390884005.us-east-1.elb.amazonaws.com

jobs:
  deploy:
    name: Build, push, and roll out
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:initial
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.deployments[0].{status:status,desired:desiredCount,rollout:rolloutState}' \
            --output table

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify health endpoint
        # app.remediatelabs.io is proxied through Cloudflare Access, which
        # intercepts *every* path (including /health and /debug/*) with a
        # 302 to its login page. `curl -fL` treats that login page's 200 as
        # success, so deploy-time checks against the public hostname are
        # false positives. `--connect-to` keeps the TLS SNI/cert matching
        # app.remediatelabs.io but routes the TCP connection straight to
        # the ALB (env.ALB_DNS), skipping Cloudflare entirely.
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 --connect-to "app.remediatelabs.io:443:${ALB_DNS}:443" \
                 https://app.remediatelabs.io/health > /dev/null; then
              echo "Health check OK"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rebuild code graph index
        # Non-blocking: DiagnosisAgent/FixGenerationAgent fall back to RAG
        # search when the graph is empty, so a failed rebuild shouldn't
        # fail the deploy.
        run: |
          curl -sf --max-time 120 --connect-to "app.remediatelabs.io:443:${ALB_DNS}:443" \
            -X POST https://app.remediatelabs.io/debug/code-graph/index \
            || echo "Code graph index rebuild failed, continuing"
