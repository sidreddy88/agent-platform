name: TriageAgent Regression

# Hard regression gate for TriageAgent: any PR touching triage.py or base.py
# (the shared ReAct loop TriageAgent inherits from) must replay the full
# 108-case held-out golden set and get every single one right before
# merging. See scripts/eval_triage_full_regression.py for the PASS-only
# scoring rationale.
#
# Unlike ci.yml, this makes real Anthropic API calls -- real cost, but much
# cheaper/faster than the sibling DiagnosisAgent gate (diagnosis-regression.yml):
# no git checkout, no GitHub API, one Haiku call per case. Expect low
# single-digit minutes, not the hour-plus Diagnosis's Sonnet-plus-tool-loop
# gate needs.

on:
  pull_request:
    paths:
      - "app/agents/triage.py"
      - "app/agents/base.py"

concurrency:
  group: triage-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: full held-out replay (108 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run full TriageAgent regression gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/eval_triage_full_regression.py
