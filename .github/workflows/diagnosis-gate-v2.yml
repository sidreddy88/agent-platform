name: Diagnosis gate v2

# The diagnosis regression gate: every non-draft PR that changes diagnosis
# replays all 434 SWE-bench Verified cases outside the held-out repos (2
# trials each) and compares each case with main's own measured pass rate
# (app/evals/gate_v2_baseline.json) in a paired test. Design, power analysis
# and validation: app/evals/gate_v2.py and harness-evolution-v2.md §0.11.
#
# "Changes diagnosis" = diagnosis.py, base.py (the shared ReAct loop), the
# diagnosis harness (app/agents/harness/diagnosis/ and the shared loader
# harness/__init__.py; the fix agent's harness/fix/ doesn't affect diagnosis),
# or the parts of config/llm_routing.json diagnosis reads (its routing entry, the
# defaults, its models' prices: scripts/diagnosis_inputs_changed.py). The check
# runs inside the workflow, not as an on.paths filter, so the `gate` job always
# reports and can be a required check: it passes fast when nothing relevant
# changed or the PR is a draft, and gives the real verdict when it did.
#
# Fails closed when the baseline is stale: if diagnosis changed on main after
# the baseline was measured, comparing against it would be comparing against
# the wrong thing. Refresh it with diagnosis-gate-v2-manual.yml (mode=baseline).
#
# Each run costs ~$29 on Together and ~40 minutes. A new push cancels the run
# in flight for the same PR.
#
# Smoke tier first (scripts/diagnosis_smoke.py, measured with agentstats): 40
# pool cases sampled across repos, one trial, ~$1.50 and ~10 minutes, compared
# case by case with the same baseline. It fails only on clear breakage (worse
# than main by more than 15 points); then the full gate doesn't run and the PR
# doesn't spend $29 to learn it's broken. PASS or INCONCLUSIVE lets the full
# gate run and decide.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: diagnosis-gate-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect diagnosis changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      stale: ${{ steps.filter.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "stale=false" >> "$GITHUB_OUTPUT"
          # The PR's live draft state, not the event payload's (see the v1 gate's history).
          draft=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
                  --json isDraft --jq .isDraft 2>/dev/null || echo "${{ github.event.pull_request.draft }}")
          if [ "$draft" = "true" ]; then
            echo "Draft PR: the gate runs when it's marked ready for review."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "${{ github.event.pull_request.head.sha }}")
          if ! python3 scripts/diagnosis_inputs_changed.py "$base" "${{ github.event.pull_request.head.sha }}"; then
            echo "No diagnosis changes since main."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          measured=$(python3 -c "import json; print(json.load(open('app/evals/gate_v2_baseline.json'))['main_sha'])")
          if ! git cat-file -e "$measured^{commit}" 2>/dev/null; then
            echo "Baseline commit $measured not found: treating the baseline as stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/diagnosis_inputs_changed.py "$measured" "$base" > /tmp/stale.txt; then
            echo "Diagnosis changed on main since the baseline ($measured): it's stale."
            cat /tmp/stale.txt
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: smoke tier (40 cases, agentstats)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.stale == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies and agentstats
        run: pip install -r requirements-dev.txt     # includes agentstats (PyPI, pinned there)

      - name: Replay the smoke sample (1 trial)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DIAGNOSIS_REGRESSION_GITHUB_PAT }}
        run: |
          set -euo pipefail
          python scripts/diagnosis_smoke.py sample --out runs/smoke/cases.json
          rc=0
          python scripts/optimize_harness.py --run-dir runs/smoke --cases-file runs/smoke/cases.json \
            --rounds 0 --calibration-trials 1 --budget 3 --parallel 2 --lane-width 3 --no-pass-rate-tripwire || rc=$?
          python scripts/gate_v2.py collect --run-dir runs/smoke --trials 1 --out runs/smoke/verdicts.json
          echo "runner exit code: $rc (missing cases count as infrastructure failures below)"

      - name: Smoke gate (fails only on clear breakage)
        run: |
          python scripts/diagnosis_smoke.py convert --results runs/smoke/verdicts.json --out runs/smoke/pr.jsonl
          python scripts/diagnosis_smoke.py baseline --cases runs/smoke/cases.json --out runs/smoke/baseline.jsonl
          rc=0
          agentstats gate --policy app/evals/diagnosis_gate_policy.toml --tier smoke \
            --candidate runs/smoke/pr.jsonl --baseline runs/smoke/baseline.jsonl || rc=$?
          # 0 pass, 2 inconclusive: let the full gate decide. 1 fail, 3 unhealthy: stop here.
          if [ "$rc" = "2" ]; then echo "Smoke inconclusive: the full gate decides."; exit 0; fi
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnosis-smoke
          path: runs/smoke/*.json*
          if-no-files-found: ignore

  run:
    needs: [changes, smoke]
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.stale == 'false' && needs.smoke.result == 'success'
    uses: ./.github/workflows/diagnosis-gate-v2-run.yml
    secrets: inherit
    with:
      mode: gate
      trials: "2"
      shard_budget_usd: "4"

  gate:
    name: diagnosis gate v2
    needs: [changes, smoke, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection ended as '${{ needs.changes.result }}': no verdict."; exit 1
          fi
          if [ "${{ needs.changes.outputs.run }}" != "true" ]; then
            echo "Nothing relevant changed (or draft): passing."; exit 0
          fi
          if [ "${{ needs.changes.outputs.stale }}" = "true" ]; then
            echo "The baseline is stale: refresh it (diagnosis-gate-v2-manual.yml, mode=baseline) and commit it."; exit 1
          fi
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Smoke tier ended as '${{ needs.smoke.result }}' (clear breakage or too many infra failures):"
            echo "the full gate didn't run. See the smoke job's summary."; exit 1
          fi
          if [ "${{ needs.run.result }}" != "success" ]; then
            echo "Gate v2 ended as '${{ needs.run.result }}': see the paired-test job's summary."; exit 1
          fi
          echo "Gate v2 passed."
