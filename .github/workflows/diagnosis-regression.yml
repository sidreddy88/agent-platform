name: DiagnosisAgent Regression

# Hard regression gate for DiagnosisAgent: any PR touching diagnosis.py or
# base.py (the shared ReAct loop DiagnosisAgent inherits from) must replay
# the full 62-case golden dataset (6 real production incidents + 56
# SWE-bench Verified instances known to pass today) and get every single
# one right before merging. See scripts/eval_diagnosis_full_regression.py
# for why 56, not the full 100-instance sample, and why PASS is the only
# acceptable verdict here.
#
# Unlike ci.yml, this makes real Anthropic + GitHub API calls -- real cost,
# real runtime (expect over an hour for the full 62 cases). That's why the
# expensive replay itself is still scoped to only the files that can
# actually change DiagnosisAgent's behavior.
#
# The path check is done INSIDE the job (via the "Check whether relevant
# files changed" step below), not as a top-level `on.pull_request.paths`
# filter. This job is marked as a required status check in main's branch
# protection -- a trigger-level path filter means the workflow (and its
# check) never runs at all on PRs that don't touch these files, which
# leaves a required check permanently "Expected -- waiting for status to
# be reported" and blocks merging forever. Running the job unconditionally
# and skipping the expensive steps internally means the check always
# reports (fast success when nothing relevant changed, real pass/fail when
# it did), so requiring it doesn't strand unrelated PRs.

on:
  pull_request:

concurrency:
  group: diagnosis-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: full golden-dataset replay (62 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether relevant files changed
        id: filter
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | grep -qE '^app/agents/(diagnosis|base)\.py$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Run full DiagnosisAgent regression gate
        if: steps.filter.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # NOT the built-in secrets.GITHUB_TOKEN -- that's scoped to this repo
          # only, and the 6 production cases need to clone the actual target
          # app repo. Same fine-grained PAT already used in prod; see
          # docs/GITHUB_TOKEN_SETUP.md. (The 56 SWE-bench cases are all public
          # repos and would work with either token, or none at all.)
          GITHUB_TOKEN: ${{ secrets.DIAGNOSIS_REGRESSION_GITHUB_PAT }}
          FIX_TARGET_REPO: ${{ vars.FIX_TARGET_REPO }}
        run: python scripts/eval_diagnosis_full_regression.py

      - name: Skipped -- no relevant files changed
        if: steps.filter.outputs.run == 'false'
        run: echo "No changes to diagnosis.py/base.py in this PR -- skipping the 62-case replay."
