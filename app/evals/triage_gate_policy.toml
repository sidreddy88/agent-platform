# agentstats policy for the TriageAgent gate (.github/workflows/triage-regression.yml; scripts/triage_gate.py).
# Sized on a 2026-10-22 baseline (114 cases x 4 trials, 92.1%, measured on a Mac). The committed baseline is measured
# in CI by the "TriageAgent gate baseline" workflow (2026-10-23: 91.9%), TriageAgent without the target harness docs,
# by simulation with a 90% interval (scripts/triage_gate.py size --trials 2 --margin 0 --rule drop):
#   no change: 5% false alarms; drop of 2.5 pts caught 25%; 5 pts 64%; 8 pts 94%; 12 pts 100%.
# The old rule (fail above 5 misses of 80 filtered cases, 1 run), same rates: ~0% false alarms; 14% / 48% / 82%
# / 97%, blind to the 34 excluded noisy-template cases, and API outages scored as misses.
design = "curated"

# 2026-10-26: TriageAgent runs on Haiku 5.5 (#295); the baseline is re-measured on it. Answers the agent couldn't
# produce (step limit, unparseable output) are rows with no_answer: failures, reported apart (agentstats 0.3).

[pr]
runs = 2
slice_by = "template"               # per-template table vs the baseline in the job summary (reported, not enforced:
                                    # most templates have under 15 cases, too few to prove a slice drop)
require.no_significant_drop = 0.0   # FAIL only on a proven drop below main's baseline
require.max_infra = 0.10            # above this, API trouble: exit 3, rerun
require.max_no_answer = 0.05        # above this, the agent loop or the answer parsing broke, not judgement
# Behaviour rules (scripts/triage_gate.py _checks), no labels needed: did it call check_duplicate_pr, and
# get_occurrence_count when there's a log group? The labels once rewarded skipping the count, so accuracy couldn't
# catch it.
require.min_rule_rate = 0.95        # each rule holds at least this often (FAIL only when the interval is below)
require.no_rule_regression = 0.0    # FAIL if any rule is proven to hold less often than in main's baseline
require.max_cost_ratio = 1.25       # cost per run, PR / baseline (bootstrap CI): catches prompt bloat and tool loops

# 2026-10-31: nightly check of main against the same baseline (.github/workflows/triage-nightly.yml). Catches
# regressions with no code change (provider model updates, dependency upgrades, infrastructure drift), which the PR
# gate never sees. Same requirements as a PR; the workflow reruns once on INCONCLUSIVE before raising an issue.
[nightly]
runs = 2
slice_by = "template"
require.no_significant_drop = 0.0
require.max_infra = 0.10
require.max_no_answer = 0.05
require.min_rule_rate = 0.95
require.no_rule_regression = 0.0
# 2026-10-31: reliability, cost and latency. Simulated on the baseline (200 nights of 2 trials per case vs the other
# 2, unchanged agent): 0 false alarms at these limits; a pass^2 floor of 88% was INCONCLUSIVE 60% of nights. pass^2 = both trials of a case pass; the baseline's is 92.3%,
# last night's 93.0%. Cost and p95 latency are ratios to the baseline; last night 1.01x and 0.91x. Latency is
# nightly-only: provider slowness shouldn't block a PR, but a 50% slower agent is worth an issue.
require.min_pass_hat_k = 0.85
require.max_cost_ratio = 1.25
require.max_p95_latency_ratio = 1.5
